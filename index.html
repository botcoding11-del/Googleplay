<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulador Google Play</title>
    <style>
        /* Resetear márgenes y hacer que ocupe toda la pantalla */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Roboto', Arial, sans-serif;
            overflow: hidden; /* Evita scroll */
            width: 100vw;
            height: 100vh;
        }

        #phone-screen {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #121212;
            overflow: hidden;
        }

        /* Clase para las vistas (pantallas) */
        .vista {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none; /* Ocultas por defecto */
            background-color: #121212;
            /* Ajustamos la imagen para que cubra toda la pantalla sin deformarse */
            background-size: contain; /* Prueba con 'contain' o 'cover' según tus imágenes */
            background-position: center;
            background-repeat: no-repeat;
        }

        .vista.activa {
            display: block; /* Solo la vista activa se muestra */
        }

        /* Botones invisibles superpuestos (Hotspots) */
        /* Usamos porcentajes para que se adapten a cualquier pantalla */
        .hotspot {
            position: absolute;
            cursor: pointer;
            background: rgba(255, 255, 255, 0); 
            z-index: 10;
            transition: background 0.2s;
            /* Borde invisible para depurar si es necesario */
            /* border: 1px solid red; */ 
        }
        
        .hotspot:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Estilos para el formulario de tarjeta (GUI) */
        #formulario-tarjeta {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #1e1e1e;
            padding: 20px;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #formulario-tarjeta input, #formulario-tarjeta select {
            width: 80%;
            max-width: 400px;
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
            font-size: 16px;
        }

        #formulario-tarjeta button {
            width: 80%;
            max-width: 400px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-guardar { background-color: #4CAF50; color: white; }
        .btn-atras { background-color: #f44336; color: white; }

        /* Estilos para la lista de compras simuladas */
        #lista-compras {
            position: absolute;
            top: 30%; /* Debajo del presupuesto */
            left: 5%;
            width: 90%;
            color: white;
            max-height: 60vh;
            overflow-y: auto;
        }
        
        .item-compra {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 10px;
            border-bottom: 1px solid #333;
            cursor: pointer;
        }
        
        .item-compra img {
            width: 40px;
            height: 40px;
        }
        
        .detalles-compra {
            margin-left: 10px;
            flex-grow: 1;
        }

        /* Estilos para los textos dinámicos en Detalles */
        .texto-detalle {
            position: absolute;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="phone-screen">
    
    <!-- VISTA 1: PAGOS Y SUSCRIPCIONES -->
    <!-- Ajusta los porcentajes de left y top según tus imágenes reales -->
    <div id="vista-pagos" class="vista activa" style="background-image: url('pagos_suscripciones.jpg');">
        <!-- Botón: Formas de pago (Aproximadamente 20% left, 30% top) -->
        <div class="hotspot" style="left: 15%; top: 28%; width: 50%; height: 8%;" onclick="cambiarVista('vista-formas-pago')"></div>
        <!-- Botón: Historial y presupuesto (Aproximadamente 15% left, 75% top) -->
        <div class="hotspot" style="left: 15%; top: 75%; width: 60%; height: 8%;" onclick="cambiarVista('vista-historial')"></div>
    </div>

    <!-- VISTA 2: FORMAS DE PAGO -->
    <div id="vista-formas-pago" class="vista" style="background-image: url('formas_pago.jpg');">
        <!-- Botón: Flecha atrás (Arriba a la izquierda) -->
        <div class="hotspot" style="left: 5%; top: 2%; width: 10%; height: 6%;" onclick="cambiarVista('vista-pagos')"></div>
        <!-- Botón: Agregar tarjeta (Abajo, aproximadamente 80% top) -->
        <div class="hotspot" style="left: 10%; top: 83%; width: 80%; height: 6%;" onclick="abrirFormularioTarjeta()"></div>
        
        <!-- Contenedor dinámico para las tarjetas guardadas -->
        <div id="contenedor-tarjetas-guardadas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></div>
    </div>

    <!-- VISTA 3: HISTORIAL Y PRESUPUESTO -->
    <div id="vista-historial" class="vista" style="background-image: url('historial_presupuesto.jpg');">
        <!-- Botón: Flecha atrás (Arriba a la izquierda) -->
        <div class="hotspot" style="left: 5%; top: 2%; width: 10%; height: 6%;" onclick="cambiarVista('vista-formas-pago')"></div>
        
        <!-- Barra de progreso interactiva (simulada con un div) -->
        <!-- Ajusta estos porcentajes para que coincidan con la barra de tu imagen -->
        <div id="barra-progreso" style="position: absolute; left: 10%; top: 28%; width: 80%; height: 3%; cursor: pointer; z-index: 20;">
        </div>
        
        <!-- Contenedor de compras de Robux -->
        <div id="lista-compras">
            <!-- Se llenará con JS -->
        </div>
    </div>

    <!-- VISTA 4: DETALLES DE LA COMPRA -->
    <div id="vista-detalles" class="vista" style="background-image: url('detalles.jpg');">
        <!-- Botón: Entendido (Abajo) -->
        <div class="hotspot" style="left: 20%; top: 90%; width: 60%; height: 8%;" onclick="cambiarVista('vista-historial')"></div>
        
        <!-- Texto dinámico para la fecha, forma de pago -->
        <div id="fecha-detalle" class="texto-detalle" style="left: 25%; top: 45%;"></div>
        <div id="pago-detalle" class="texto-detalle" style="left: 10%; top: 68%;"></div>
    </div>

    <!-- FORMULARIO EMERGENTE (GUI) PARA AGREGAR TARJETA -->
    <div id="formulario-tarjeta">
        <h2 style="margin-bottom: 20px;">Agregar tarjeta</h2>
        <input type="text" id="input-numero" placeholder="Número de tarjeta (16 dígitos)" maxlength="16">
        <input type="text" id="input-nombre" placeholder="Nombre del titular">
        <input type="text" id="input-pais" placeholder="País">
        <input type="text" id="input-fecha" placeholder="Fecha de vencimiento (MM/AA)">
        <input type="text" id="input-cvv" placeholder="CVV" maxlength="3">
        
        <button class="btn-guardar" onclick="guardarTarjeta()">Guardar Tarjeta</button>
        <button class="btn-atras" onclick="cerrarFormularioTarjeta()">Cancelar / Volver</button>
    </div>

</div>

<script>
    // --- ESTADO GLOBAL DE LA APLICACIÓN ---
    let tarjetasGuardadas = [];
    let gastoTotal = 0; // En CLP
    const PRESUPUESTO_MAXIMO = 1000000;
    
    // --- FUNCIÓN PARA CAMBIAR DE VISTA ---
    function cambiarVista(idVista) {
        document.querySelectorAll('.vista').forEach(v => v.classList.remove('activa'));
        document.getElementById(idVista).classList.add('activa');
        
        if(idVista === 'vista-historial') {
            renderizarCompras();
        }
    }

    // --- LÓGICA DE AGREGAR TARJETA ---
    function abrirFormularioTarjeta() {
        document.getElementById('formulario-tarjeta').style.display = 'flex';
    }

    function cerrarFormularioTarjeta() {
        document.getElementById('formulario-tarjeta').style.display = 'none';
        document.getElementById('input-numero').value = '';
        document.getElementById('input-nombre').value = '';
        document.getElementById('input-pais').value = '';
        document.getElementById('input-fecha').value = '';
        document.getElementById('input-cvv').value = '';
    }

    function guardarTarjeta() {
        const numero = document.getElementById('input-numero').value;
        if(numero.length < 4) {
            alert("Por favor ingresa un número de tarjeta válido (mínimo 4 dígitos).");
            return;
        }
        const ultimos4 = numero.slice(-4);
        tarjetasGuardadas.push({ ultimos4: ultimos4, tipo: "Visa" });
        cerrarFormularioTarjeta();
        renderizarTarjetas();
    }

    function renderizarTarjetas() {
        const contenedor = document.getElementById('contenedor-tarjetas-guardadas');
        contenedor.innerHTML = ''; 

        // Ajusta estos valores según donde quieras que aparezca la tarjeta en tu imagen
        let topBase = 60; // 60% de la pantalla
        let leftBase = 10; // 10% de la pantalla

        tarjetasGuardadas.forEach((tarjeta, index) => {
            const divTarjeta = document.createElement('div');
            const topActual = topBase + (index * 8); // Se separan un 8% hacia abajo
            
            divTarjeta.style.position = 'absolute';
            divTarjeta.style.left = leftBase + '%';
            divTarjeta.style.top = topActual + '%';
            divTarjeta.style.display = 'flex';
            divTarjeta.style.alignItems = 'center';
            divTarjeta.style.zIndex = '15'; 

            const img = document.createElement('img');
            img.src = 'visa.jpg'; 
            img.style.width = '40px';
            img.style.height = 'auto';
            img.style.marginRight = '15px';
            
            const texto = document.createElement('span');
            texto.innerText = `${tarjeta.tipo}-${tarjeta.ultimos4}`;
            texto.style.color = '#fff';
            texto.style.fontSize = '16px';

            divTarjeta.appendChild(img);
            divTarjeta.appendChild(texto);
            contenedor.appendChild(divTarjeta);
        });
    }

    // --- LÓGICA DE HISTORIAL Y PRESUPUESTO ---
    function configurarBarraPresupuesto() {
        const barra = document.getElementById('barra-progreso');
        
        // Detectar clic en la barra para cambiar el gasto
        barra.addEventListener('click', function(e) {
            const rect = barra.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            let porcentaje = clickX / rect.width;
            if (porcentaje < 0) porcentaje = 0;
            if (porcentaje > 1) porcentaje = 1;
            gastoTotal = Math.round(porcentaje * PRESUPUESTO_MAXIMO);
            console.log(`Gasto actualizado a: $${gastoTotal}`);
            actualizarComprasPorGasto();
            renderizarCompras();
        });
    }

    let comprasRealizadas = [];

    function actualizarComprasPorGasto() {
        comprasRealizadas = [];
        let gastoRestante = gastoTotal;
        const precioRobux = 4400; 

        while (gastoRestante >= precioRobux) {
            comprasRealizadas.push({
                id: 'GPA.' + Math.floor(Math.random() * 1000000),
                monto: precioRobux,
                robux: 320,
                fecha: '16 de octubre de 2026',
                formaPago: tarjetasGuardadas.length > 0 ? `${tarjetasGuardadas[0].tipo}-${tarjetasGuardadas[0].ultimos4}` : 'Visa-3295'
            });
            gastoRestante -= precioRobux;
        }
    }

    function renderizarCompras() {
        const contenedor = document.getElementById('lista-compras');
        contenedor.innerHTML = '';
        if (comprasRealizadas.length === 0) {
            contenedor.innerHTML = '<p style="color: #888; text-align: center; margin-top: 50px;">No hay compras realizadas.</p>';
            return;
        }
        comprasRealizadas.forEach((compra) => {
            const item = document.createElement('div');
            item.className = 'item-compra';
            
            const icono = document.createElement('div');
            icono.style.width = '40px'; icono.style.height = '40px';
            icono.style.backgroundColor = '#3b5998'; icono.style.borderRadius = '8px';
            icono.style.display = 'flex'; icono.style.justifyContent = 'center'; icono.style.alignItems = 'center';
            icono.innerHTML = '<span style="font-size: 20px;">R</span>';

            const detalles = document.createElement('div');
            detalles.className = 'detalles-compra';
            detalles.innerHTML = `<div style="font-weight: bold;">320 Robux</div><div style="font-size: 12px; color: #aaa;">${compra.fecha}</div>`;

            const precio = document.createElement('div');
            precio.innerText = `$${compra.monto}`;
            precio.style.fontWeight = 'bold';

            item.appendChild(icono); item.appendChild(detalles); item.appendChild(precio);

            item.onclick = () => {
                document.getElementById('fecha-detalle').innerText = compra.fecha;
                document.getElementById('pago-detalle').innerText = compra.formaPago;
                cambiarVista('vista-detalles');
            };
            contenedor.appendChild(item);
        });
    }

    // --- INICIALIZACIÓN ---
    window.onload = function() {
        configurarBarraPresupuesto();
        cambiarVista('vista-pagos');
    };
</script>

</body>
</html>
