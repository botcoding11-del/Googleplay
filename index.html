<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador visual</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Roboto,Arial,sans-serif}
#phone-screen{position:fixed;inset:0;overflow:hidden;background:#121212}
.vista{position:absolute;left:50%;top:50%;display:none;width:1px;height:1px;overflow:hidden;background:#121212 no-repeat 0 0;transform-origin:center center}
.vista.activa{display:block}
.hotspot{position:absolute;z-index:10;border:0;background:transparent;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
#formulario-tarjeta{position:absolute;inset:0;z-index:100;display:none;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:22px;background:#1e1e1e;overflow:auto}
#formulario-tarjeta h2{font-size:23px;margin-bottom:4px}
#formulario-tarjeta p{max-width:400px;text-align:center;color:#bbb;font-size:14px;line-height:1.4}
#formulario-tarjeta input,#formulario-tarjeta button{width:100%;max-width:400px;padding:13px;border-radius:7px;font-size:16px}
#formulario-tarjeta input{border:1px solid #444;background:#292929;color:white}
#formulario-tarjeta button{border:0;color:#fff}
.btn-guardar{background:#3478f6}.btn-atras{background:#555}
#lista-compras{position:absolute;left:40px;top:520px;width:calc(100% - 80px);max-height:600px;overflow:auto;color:white;scrollbar-width:thin}
.item-compra{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:15px 10px;border-bottom:1px solid #333;cursor:pointer;min-height:64px}
.detalles-compra{flex:1;min-width:0}
#contenedor-tarjetas-guardadas{position:absolute;inset:0;pointer-events:none}
.texto-detalle{position:absolute;color:#fff;font-size:22px;line-height:1.25;font-weight:500;white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<div id="phone-screen">
  <div id="vista-pagos" class="vista" style="background-image:url('pagos_suscripciones.jpg')">
    <button class="hotspot" aria-label="Formas de pago" style="left:112px;top:300px;width:250px;height:50px" onclick="cambiarVista('vista-formas-pago')"></button>
    <button class="hotspot" aria-label="Historial y presupuesto" style="left:104px;top:768px;width:250px;height:50px" onclick="cambiarVista('vista-historial')"></button>
  </div>

  <div id="vista-formas-pago" class="vista" style="background-image:url('formas_pago.jpg')">
    <button class="hotspot" aria-label="Volver" style="left:35px;top:20px;width:70px;height:70px" onclick="cambiarVista('vista-pagos')"></button>
    <button class="hotspot" aria-label="Agregar tarjeta de demostración" style="left:35px;top:810px;width:600px;height:70px" onclick="abrirFormularioTarjeta()"></button>
    <div id="contenedor-tarjetas-guardadas"></div>
  </div>

  <div id="vista-historial" class="vista" style="background-image:url('historial_presupuesto.jpg')">
    <button class="hotspot" aria-label="Volver" style="left:20px;top:20px;width:60px;height:60px" onclick="cambiarVista('vista-pagos')"></button>
    <!-- Zona interactiva alineada con la barra original -->
    <button id="barra-progreso" class="hotspot" aria-label="Ajustar gasto de demostración" style="left:57px;top:277px;width:445px;height:20px"></button>
    <div id="lista-compras"></div>
  </div>

  <div id="vista-detalles" class="vista" style="background-image:url('detalles.jpg')">
    <button class="hotspot" aria-label="Entendido" style="left:5.5%;top:90.5%;width:89%;height:8%" onclick="cambiarVista('vista-historial')"></button>
    <div id="fecha-detalle" class="texto-detalle" style="left:175px;top:453px;font-size:16px"></div>
    <div id="pago-detalle" class="texto-detalle" style="left:70px;top:688px;font-size:16px"></div>
  </div>

  <div id="formulario-tarjeta">
    <h2>Tarjeta ficticia de demostración</h2>
    <p>Esta interfaz es solo una maqueta local. No introduzcas datos bancarios reales.</p>
    <input id="input-numero" type="text" inputmode="numeric" maxlength="4" placeholder="Últimos 4 dígitos ficticios">
    <input id="input-nombre" type="text" placeholder="Nombre de demostración">
    <input id="input-pais" type="text" placeholder="País">
    <input id="input-fecha" type="text" placeholder="Fecha ficticia (MM/AA)">
    <button class="btn-guardar" onclick="guardarTarjeta()">Añadir tarjeta de prueba</button>
    <button class="btn-atras" onclick="cerrarFormularioTarjeta()">Cancelar / volver</button>
  </div>
</div>

<script>
const tarjetasGuardadas=[];
let gastoTotal=0;
let comprasRealizadas=[];
const PRESUPUESTO_MAXIMO=1000000;
const PRECIO_ROBUX=4400;
const imagenesCargadas=new Map();

function prepararVista(vista){
  const css=getComputedStyle(vista).backgroundImage;
  const match=css.match(/url\(["']?(.*?)["']?\)/);
  if(!match)return;
  const url=match[1];
  if(imagenesCargadas.has(url)){
    aplicarDimensiones(vista,imagenesCargadas.get(url));
    return;
  }
  const img=new Image();
  img.onload=()=>{
    const dims={w:img.naturalWidth,h:img.naturalHeight};
    imagenesCargadas.set(url,dims);
    document.querySelectorAll('.vista').forEach(v=>{
      const bg=getComputedStyle(v).backgroundImage.match(/url\(["']?(.*?)["']?\)/);
      if(bg&&bg[1]===url)aplicarDimensiones(v,dims);
    });
  };
  img.onerror=()=>console.error('No se pudo cargar: '+url);
  img.src=url;
}
function aplicarDimensiones(vista,dims){
  vista.dataset.baseWidth=dims.w;
  vista.dataset.baseHeight=dims.h;
  vista.style.width=dims.w+'px';
  vista.style.height=dims.h+'px';
  vista.style.backgroundSize=dims.w+'px '+dims.h+'px';
  escalarVista(vista);
}
function escalarVista(vista){
  const w=Number(vista.dataset.baseWidth),h=Number(vista.dataset.baseHeight);
  if(!w||!h)return;
  const screen=document.getElementById('phone-screen');
  const scale=Math.min((screen.clientWidth-12)/w,(screen.clientHeight-12)/h);
  vista.style.transform=`translate(-50%,-50%) scale(${scale})`;
}
function ajustarTodo(){
  document.querySelectorAll('.vista').forEach(v=>{
    if(v.dataset.baseWidth)escalarVista(v);
    else prepararVista(v);
  });
}
window.addEventListener('resize',ajustarTodo);
window.addEventListener('orientationchange',ajustarTodo);

function cambiarVista(id){
  const destino=document.getElementById(id);
  if(!destino)return;
  document.querySelectorAll('.vista').forEach(v=>v.classList.remove('activa'));
  destino.classList.add('activa');
  if(id==='vista-historial')renderizarCompras();
}
function abrirFormularioTarjeta(){document.getElementById('formulario-tarjeta').style.display='flex'}
function cerrarFormularioTarjeta(){
  document.getElementById('formulario-tarjeta').style.display='none';
  ['input-numero','input-nombre','input-pais','input-fecha'].forEach(id=>document.getElementById(id).value='');
}
function guardarTarjeta(){
  const ultimos4=document.getElementById('input-numero').value.replace(/\D/g,'').slice(-4);
  if(ultimos4.length!==4){alert('Introduce 4 dígitos ficticios.');return}
  tarjetasGuardadas.push({ultimos4,tipo:'Visa'});
  cerrarFormularioTarjeta();renderizarTarjetas();
}
function renderizarTarjetas(){
  const cont=document.getElementById('contenedor-tarjetas-guardadas');cont.innerHTML='';
  tarjetasGuardadas.forEach((t,i)=>{
    const row=document.createElement('div');
    Object.assign(row.style,{position:'absolute',left:'85px',top:(760+i*95)+'px',display:'flex',alignItems:'center',gap:'18px',zIndex:'15'});
    const img=document.createElement('img');img.src='visa.jpg';img.alt='Marca ficticia';img.style.width='50px';img.style.height='auto';
    const label=document.createElement('span');label.textContent=`${t.tipo}-${t.ultimos4}`;label.style.cssText='color:white;font-size:24px';
    row.append(img,label);cont.append(row);
  });
}
function configurarBarraPresupuesto(){
  const barra=document.getElementById('barra-progreso');
  barra.addEventListener('click',e=>{
    const r=barra.getBoundingClientRect();if(!r.width)return;
    const pct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    gastoTotal=Math.round(pct*PRESUPUESTO_MAXIMO);
    actualizarComprasPorGasto();renderizarCompras();
  });
}
function actualizarComprasPorGasto(){
  comprasRealizadas=[];
  const cantidad=Math.min(80,Math.floor(gastoTotal/PRECIO_ROBUX));
  const pago=tarjetasGuardadas.length?`Visa-${tarjetasGuardadas[0].ultimos4}`:'Visa-3295';
  for(let i=0;i<cantidad;i++){
    comprasRealizadas.push({id:'DEMO-'+(i+1),monto:PRECIO_ROBUX,robux:320,fecha:'16 de octubre de 2026',formaPago:pago});
  }
}
function renderizarCompras(){
  const cont=document.getElementById('lista-compras');cont.innerHTML='';
  if(!comprasRealizadas.length){
    const p=document.createElement('p');p.textContent='No hay compras en esta demostración.';
    p.style.cssText='color:#888;text-align:center;margin-top:25px;font-size:18px';cont.append(p);return;
  }
  comprasRealizadas.forEach(compra=>{
    const item=document.createElement('div');item.className='item-compra';
    const icon=document.createElement('div');
    icon.style.cssText='width:40px;height:40px;flex-shrink:0;background:#3b5998;border-radius:8px;display:flex;justify-content:center;align-items:center;font-size:20px';
    icon.textContent='R';
    const details=document.createElement('div');details.className='detalles-compra';
    const title=document.createElement('div');title.style.fontWeight='bold';title.textContent='320 Robux · DEMO';
    const date=document.createElement('div');date.style.cssText='font-size:12px;color:#aaa';date.textContent=compra.fecha;
    details.append(title,date);
    const price=document.createElement('div');price.style.fontWeight='bold';price.textContent='$'+compra.monto.toLocaleString('es-CL');
    item.append(icon,details,price);
    item.addEventListener('click',()=>{
      document.getElementById('fecha-detalle').textContent=compra.fecha;
      document.getElementById('pago-detalle').textContent=compra.formaPago+' · DEMO';
      cambiarVista('vista-detalles');
    });
    cont.append(item);
  });
}
window.addEventListener('load',()=>{
  document.querySelectorAll('.vista').forEach(prepararVista);
  configurarBarraPresupuesto();
  cambiarVista('vista-pagos');
});
</script>
</body>
</html>
