
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Simulador Google Play</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: Roboto, Arial, sans-serif;
}

#phone-screen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #121212;
}

/* Cada vista conserva las dimensiones y proporciones de su imagen. */
.vista {
    position: absolute;
    top: 50%;
    left: 50%;
    display: none;
    width: 1px;
    height: 1px;
    overflow: hidden;
    background-color: #121212;
    background-position: 0 0;
    background-repeat: no-repeat;
    transform-origin: center center;
}

.vista.activa {
    display: block;
}

/* Zonas táctiles transparentes */
.hotspot {
    position: absolute;
    z-index: 10;
    display: block;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

/* Activa estas reglas temporalmente si necesitas depurar los clics. */
/*
.hotspot {
    background: rgba(255, 0, 0, 0.2);
    outline: 1px solid red;
}
*/

#formulario-tarjeta {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 20px;
    background: #1e1e1e;
    overflow-y: auto;
}

#formulario-tarjeta h2 {
    margin-bottom: 10px;
}

#formulario-tarjeta input {
    width: 100%;
    max-width: 400px;
    padding: 12px;
    border: 1px solid #444;
    border-radius: 5px;
    background: #2a2a2a;
    color: #fff;
    font-size: 16px;
}

#formulario-tarjeta button {
    width: 100%;
    max-width: 400px;
    padding: 12px;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
}

.btn-guardar {
    background: #4caf50;
    color: white;
}

.btn-atras {
    background: #f44336;
    color: white;
}

#lista-compras {
    position: absolute;
    top: 300px;
    left: 20px;
    width: calc(100% - 40px);
    max-height: 600px;
    overflow-y: auto;
    color: white;
    scrollbar-width: thin;
}

.item-compra {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 15px 10px;
    border-bottom: 1px solid #333;
    cursor: pointer;
}

.detalles-compra {
    flex: 1;
    min-width: 0;
    margin-left: 10px;
}

.texto-detalle {
    position: absolute;
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    pointer-events: none;
}

#contenedor-tarjetas-guardadas {
    position: absolute;
    inset: 0;
    pointer-events: none;
}
</style>
</head>

<body>
<div id="phone-screen">

    <!-- VISTA 1: PAGOS Y SUSCRIPCIONES -->
    <div id="vista-pagos"
         class="vista"
         style="background-image:url('pagos_suscripciones.jpg')">

        <button class="hotspot"
                aria-label="Formas de pago"
                style="left:112px;top:300px;width:250px;height:50px"
                onclick="cambiarVista('vista-formas-pago')"></button>

        <button class="hotspot"
                aria-label="Historial y presupuesto"
                style="left:104px;top:768px;width:250px;height:50px"
                onclick="cambiarVista('vista-historial')"></button>
    </div>

    <!-- VISTA 2: FORMAS DE PAGO -->
    <div id="vista-formas-pago"
         class="vista"
         style="background-image:url('formas_pago.jpg')">

        <button class="hotspot"
                aria-label="Volver"
                style="left:52px;top:35px;width:40px;height:40px"
                onclick="cambiarVista('vista-pagos')"></button>

        <button class="hotspot"
                aria-label="Agregar tarjeta de prueba"
                style="left:58px;top:841px;width:250px;height:50px"
                onclick="abrirFormularioTarjeta()"></button>

        <div id="contenedor-tarjetas-guardadas"></div>
    </div>

    <!-- VISTA 3: HISTORIAL Y PRESUPUESTO -->
    <div id="vista-historial"
         class="vista"
         style="background-image:url('historial_presupuesto.jpg')">

        <button class="hotspot"
                aria-label="Volver"
                style="left:52px;top:35px;width:40px;height:40px"
                onclick="cambiarVista('vista-pagos')"></button>

        <div id="barra-progreso"
             style="position:absolute;left:57px;top:277px;width:445px;height:20px;cursor:pointer;z-index:20">
        </div>

        <div id="lista-compras"></div>
    </div>

    <!-- VISTA 4: DETALLES -->
    <div id="vista-detalles"
         class="vista"
         style="background-image:url('detalles.jpg')">

        <!-- Situado sobre el botón azul inferior de la captura. -->
        <button class="hotspot"
                aria-label="Entendido"
                style="left:5.5%;top:90.5%;width:89%;height:8%"
                onclick="cambiarVista('vista-historial')"></button>

        <div id="fecha-detalle"
             class="texto-detalle"
             style="left:254px;top:453px"></div>

        <div id="pago-detalle"
             class="texto-detalle"
             style="left:105px;top:688px"></div>
    </div>

    <!-- FORMULARIO LOCAL DE DEMOSTRACIÓN -->
    <div id="formulario-tarjeta">
        <h2>Tarjeta de demostración</h2>
        <p style="color:#bbb;text-align:center;max-width:400px;margin-bottom:10px">
            Usa datos ficticios. No introduzcas información bancaria real.
        </p>

        <input type="text" id="input-numero"
               placeholder="Número ficticio (últimos 4 dígitos)"
               maxlength="4" inputmode="numeric">

        <input type="text" id="input-nombre"
               placeholder="Nombre de demostración">

        <input type="text" id="input-pais"
               placeholder="País">

        <input type="text" id="input-fecha"
               placeholder="Fecha ficticia (MM/AA)">

        <button class="btn-guardar" onclick="guardarTarjeta()">
            Guardar en la demostración
        </button>

        <button class="btn-atras" onclick="cerrarFormularioTarjeta()">
            Cancelar / Volver
        </button>
    </div>

</div>

<script>
const tarjetasGuardadas = [];
let gastoTotal = 0;
let comprasRealizadas = [];

const PRESUPUESTO_MAXIMO = 1000000;
const PRECIO_ROBUX = 4400;

/*
 * Lee las dimensiones reales de cada fondo.
 * La imagen, los hotspots y los elementos dinámicos se escalan juntos.
 */
function ajustarVistasResponsivas() {
    const pantalla = document.getElementById('phone-screen');
    const margen = 8;

    document.querySelectorAll('.vista').forEach(vista => {
        const fondo = getComputedStyle(vista).backgroundImage;
        const coincidencia = fondo.match(/url\(["']?(.*?)["']?\)/);

        if (!coincidencia) return;

        const imagen = new Image();

        imagen.onload = () => {
            const anchoOriginal = imagen.naturalWidth;
            const altoOriginal = imagen.naturalHeight;

            if (!anchoOriginal || !altoOriginal) return;

            const anchoDisponible = Math.max(1, pantalla.clientWidth - margen * 2);
            const altoDisponible = Math.max(1, pantalla.clientHeight - margen * 2);

            const escala = Math.min(
                anchoDisponible / anchoOriginal,
                altoDisponible / altoOriginal
            );

            vista.style.width = anchoOriginal + 'px';
            vista.style.height = altoOriginal + 'px';
            vista.style.backgroundSize =
                anchoOriginal + 'px ' + altoOriginal + 'px';

            vista.style.transform =
                `translate(-50%, -50%) scale(${escala})`;
        };

        imagen.onerror = () => {
            console.error('No se pudo cargar la imagen:', coincidencia[1]);
        };

        imagen.src = coincidencia[1];
    });
}

let temporizadorAjuste;

function programarAjuste() {
    clearTimeout(temporizadorAjuste);
    temporizadorAjuste = setTimeout(ajustarVistasResponsivas, 80);
}

window.addEventListener('resize', programarAjuste);
window.addEventListener('orientationchange', programarAjuste);

/* Navegación */
function cambiarVista(idVista) {
    const destino = document.getElementById(idVista);
    if (!destino) return;

    document.querySelectorAll('.vista').forEach(vista => {
        vista.classList.remove('activa');
    });

    destino.classList.add('activa');

    if (idVista === 'vista-historial') {
        renderizarCompras();
    }
}

/* Tarjetas ficticias */
function abrirFormularioTarjeta() {
    document.getElementById('formulario-tarjeta').style.display = 'flex';
}

function cerrarFormularioTarjeta() {
    document.getElementById('formulario-tarjeta').style.display = 'none';

    ['input-numero', 'input-nombre', 'input-pais', 'input-fecha']
        .forEach(id => document.getElementById(id).value = '');
}

function guardarTarjeta() {
    const ultimos4 = document.getElementById('input-numero').value
        .replace(/\D/g, '')
        .slice(-4);

    if (ultimos4.length !== 4) {
        alert('Introduce exactamente 4 dígitos ficticios para la demostración.');
        return;
    }

    tarjetasGuardadas.push({
        ultimos4,
        tipo: 'Visa'
    });

    cerrarFormularioTarjeta();
    renderizarTarjetas();
}

function renderizarTarjetas() {
    const contenedor = document.getElementById('contenedor-tarjetas-guardadas');
    contenedor.innerHTML = '';

    const topBase = 593;
    const leftBase = 57;

    tarjetasGuardadas.forEach((tarjeta, index) => {
        const fila = document.createElement('div');

        Object.assign(fila.style, {
            position: 'absolute',
            left: leftBase + 'px',
            top: (topBase + index * 60) + 'px',
            display: 'flex',
            alignItems: 'center',
            zIndex: '15'
        });

        const img = document.createElement('img');
        img.src = 'visa.jpg';
        img.alt = 'Visa de demostración';
        img.style.width = '40px';
        img.style.height = 'auto';
        img.style.marginRight = '15px';

        const texto = document.createElement('span');
        texto.textContent = `${tarjeta.tipo}-${tarjeta.ultimos4}`;
        texto.style.color = '#fff';
        texto.style.fontSize = '16px';

        fila.append(img, texto);
        contenedor.appendChild(fila);
    });
}

/* Historial de demostración */
function configurarBarraPresupuesto() {
    const barra = document.getElementById('barra-progreso');

    barra.addEventListener('click', event => {
        const rect = barra.getBoundingClientRect();
        if (!rect.width) return;

        const porcentaje = Math.max(
            0,
            Math.min(1, (event.clientX - rect.left) / rect.width)
        );

        gastoTotal = Math.round(porcentaje * PRESUPUESTO_MAXIMO);
        actualizarComprasPorGasto();
        renderizarCompras();
    });
}

function actualizarComprasPorGasto() {
    comprasRealizadas = [];

    const cantidad = Math.floor(gastoTotal / PRECIO_ROBUX);
    const formaPago = tarjetasGuardadas.length
        ? `${tarjetasGuardadas[0].tipo}-${tarjetasGuardadas[0].ultimos4}`
        : 'Visa-3295';

    for (let i = 0; i < cantidad; i++) {
        comprasRealizadas.push({
            id: `DEMO-${i + 1}`,
            monto: PRECIO_ROBUX,
            robux: 320,
            fecha: '16 de octubre de 2026',
            formaPago
        });
    }
}

function renderizarCompras() {
    const contenedor = document.getElementById('lista-compras');
    contenedor.innerHTML = '';

    if (comprasRealizadas.length === 0) {
        const mensaje = document.createElement('p');
        mensaje.textContent = 'No hay compras en esta demostración.';
        mensaje.style.cssText =
            'color:#888;text-align:center;margin-top:50px';
        contenedor.appendChild(mensaje);
        return;
    }

    comprasRealizadas.forEach(compra => {
        const item = document.createElement('div');
        item.className = 'item-compra';

        const icono = document.createElement('div');
        icono.style.cssText = [
            'width:40px',
            'height:40px',
            'flex-shrink:0',
            'background:#3b5998',
            'border-radius:8px',
            'display:flex',
            'justify-content:center',
            'align-items:center'
        ].join(';');
        icono.textContent = 'R';
        icono.style.fontSize = '20px';

        const detalles = document.createElement('div');
        detalles.className = 'detalles-compra';

        const titulo = document.createElement('div');
        titulo.style.fontWeight = 'bold';
        titulo.textContent = '320 Robux · DEMO';

        const fecha = document.createElement('div');
        fecha.style.cssText = 'font-size:12px;color:#aaa';
        fecha.textContent = compra.fecha;

        detalles.append(titulo, fecha);

        const precio = document.createElement('div');
        precio.style.fontWeight = 'bold';
        precio.textContent = '$' + compra.monto.toLocaleString('es-CL');

        item.append(icono, detalles, precio);

        item.addEventListener('click', () => {
            document.getElementById('fecha-detalle').textContent = compra.fecha;
            document.getElementById('pago-detalle').textContent =
                compra.formaPago + ' · DEMO';

            cambiarVista('vista-detalles');
        });

        contenedor.appendChild(item);
    });
}

/* Inicio */
window.addEventListener('load', () => {
    configurarBarraPresupuesto();
    ajustarVistasResponsivas();
    cambiarVista('vista-pagos');
});
</script>
</body>
</html>
